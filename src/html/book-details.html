<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anne of Green Gables — Livraria</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/book-details.css">
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand-logo" aria-label="Livraria Homepage">
      <img src="../assets/images/livraria-logo.png" alt="" class="brand-logo-img">
      <span class="brand-logo-text">Livraria</span>
    </a>

    <nav class="nav-links" aria-label="Main Navigation">
      <a href="/" class="nav-link">Home</a>
      <a href="/catalog" class="nav-link active" aria-current="page">My books</a>
    </nav>

    <div class="header-meta">
      <img src="../assets/icons/book-open.svg" alt="" aria-hidden="true">
      <span>Your personal library</span>
    </div>

    <button class="menu-btn" aria-label="Toggle mobile menu" aria-expanded="false">
      <img src="../assets/icons/menu.svg" alt="" aria-hidden="true">
    </button>
  </header>

  <div class="mobile-nav-drawer" role="navigation" aria-label="Mobile Navigation">
    <a href="/" class="mobile-nav-link">Home</a>
    <a href="catalog" class="mobile-nav-link active" aria-current="page">My books</a>
    <a href="add" class="mobile-nav-link">Add a book</a>
  </div>

  <main class="page-container">
    <a href="/catalog" class="btn-back">
      <img src="../assets/icons/arrow-left.svg" alt="" aria-hidden="true">
      <span>My books</span>
    </a>

    <section class="book-detail" aria-labelledby="book-title">
      <div class="book-detail-cover-column">
        <div class="book-detail-cover-well">
          <div class="book-cover book-detail-cover" role="img" aria-label="Cover of Book Title">
            <div class="spine-rule"></div>
          </div>
        </div>
        <!-- 
        <div class="book-info book-detail-summary">
          <h1 class="book-title" id="book-title">Book Title</h1>
          <p class="book-author">Author name</p>
          <p class="book-year">0000</p>
        </div>
        -->
      </div>

      <div class="book-detail-content">
        <span class="overline">Book details</span>
        <h2 class="book-detail-heading">A story on your shelf</h2>
        <p class="book-detail-description">
          Book description
        </p>

        <dl class="book-detail-facts">
          <div class="book-detail-fact book-detail-fact-author">
            <dt>Author</dt>
            <dd>Author name</dd>
          </div>
          <div class="book-detail-fact book-detail-fact-publisher">
            <dt>Publisher</dt>
            <dd>Publisher name</dd>
          </div>
          <div class="book-detail-fact book-detail-fact-publication-year">
            <dt>Publication year</dt>
            <dd>0000</dd>
          </div>
        </dl>
        <div class="book-detail-actions" role="group" aria-label="Book actions">
          <button type="button" class="btn btn-primary" id="editBookBtn">
            <img src="../assets/icons/pencil.svg" alt="" aria-hidden="true">
            <span>Edit book</span>
          </button>
          <button type="button" class="btn btn-secondary book-detail-delete" id="deleteBookBtn">
            <svg class="book-detail-delete-icon" viewBox="0 0 22 22" fill="none" aria-hidden="true" focusable="false">
              <path d="M9.16667 10.0833V15.5837M12.8333 10.0833V15.5837M17.4167 5.49956V18.3339C17.4167 18.8202 17.2235 19.2865 16.8797 19.6304C16.5359 19.9742 16.0696 20.1674 15.5833 20.1674H6.41667C5.93044 20.1674 5.46412 19.9742 5.1203 19.6304C4.77649 19.2865 4.58333 18.8202 4.58333 18.3339V5.49956M17.4167 5.49956H14.6667M17.4167 5.49956H19.25M4.58333 5.49956H2.75M4.58333 5.49956H7.33333M7.33333 5.49956H14.6667M7.33333 5.49956V3.66608C7.33333 3.17981 7.52649 2.71346 7.8703 2.36961C8.21412 2.02577 8.68044 1.8326 9.16667 1.8326H12.8333C13.3196 1.8326 13.7859 2.02577 14.1297 2.36961C14.4735 2.71346 14.6667 3.17981 14.6667 3.66608V5.49956" stroke="currentColor" stroke-linecap="round"/>
            </svg>
            <span>Delete book</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-title">Livraria · Your own little library</p>
    <p class="footer-tagline">A quiet place for your books.</p>
  </footer>

  <script type="module" src="../js/book-details.js"></script>
</body>
</html>
